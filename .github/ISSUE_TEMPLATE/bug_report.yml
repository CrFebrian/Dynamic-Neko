name: Laporan masalah
description: Ada yang tidak berjalan di Yomi Island? Ceritakan di sini.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Terima kasih sudah melapor. Cek isi kolom "Catatan error" sebelum mengirim, hapus bagian yang tidak ingin dibagikan.
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi?
      description: Ceritakan singkat. Apa yang kamu klik, apa yang kamu harapkan, dan apa yang muncul.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah untuk mengulang
      placeholder: "1. Buka panel\n2. Klik tab Anime\n3. ..."
  - type: input
    id: version
    attributes:
      label: Versi aplikasi
      description: Ada di Pengaturan > Tentang.
  - type: input
    id: os
    attributes:
      label: Windows
      description: Contoh, Windows 10 atau Windows 11.
  - type: textarea
    id: log
    attributes:
      label: Catatan error (error.log)
      description: Terisi otomatis dari tombol "Laporkan masalah" di Pengaturan. Folder berkasnya bisa dibuka dari Pengaturan > Tentang.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Tangkapan layar
      description: Tempel atau seret gambar ke sini (opsional).
