[package]
name = "yomi-island"
version = "0.1.0"
description = "Dynamic island untuk Windows dengan maskot neko"
edition = "2021"

[lib]
name = "yomi_island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
